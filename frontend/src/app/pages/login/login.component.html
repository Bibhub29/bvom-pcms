<div class="login-page">
  <div class="login-card">
    <div class="login-visual">
      <i class="bi bi-journal-code login-icon"></i>
      <h1>Organize your programming knowledge.</h1>
      <p>Manage courses, chapters, notes and reusable content in one place.</p>
      <div class="login-decoration">
        <i class="bi bi-code-slash"></i>
        <i class="bi bi-braces"></i>
        <i class="bi bi-terminal"></i>
      </div>
    </div>

    <div class="login-form">
      <span class="text-primary fw-semibold">WELCOME BACK</span>
      <h2>PCMS Portal</h2>
      <p class="text-muted mb-4">Sign in to manage your content.</p>

      <form #loginForm="ngForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label">Organization Code</label>
          <input class="form-control" name="organizationCode"
            [(ngModel)]="organizationCode" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email ID</label>
          <input class="form-control" type="email" name="email"
            [(ngModel)]="email" required email>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password"
            [(ngModel)]="password" required>
        </div>

        @if (errorMessage) {
          <div class="alert alert-primary py-2">{{ errorMessage }}</div>
        }

        <button class="btn btn-primary w-100"
          type="submit" [disabled]="loginForm.invalid">
          Sign In <i class="bi bi-arrow-right ms-2"></i>
        </button>
      </form>
    </div>
  </div>
</div>
